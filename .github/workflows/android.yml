name: Build APK

# Dispara em pushes na main e manualmente pela aba Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: burgerhouse-debug
          path: app/build/outputs/apk/debug/app-debug.apk
